<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おかえりフライト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF4FF; --sea:#CFE5FF; --land:#CDEFD9; --land-edge:#B4E3C6;
  --card:#FFFFFF; --ink:#2E3A59; --ink2:#66739A; --line:#D7E3F5;
  --pink:#FF7FA8; --pink-soft:#FFE1EB; --sun:#FFC94D; --sun-soft:#FFF1C9; --mint:#5DBE93;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161E36; --sea:#20305A; --land:#2E5249; --land-edge:#3A6559;
    --card:#212C4D; --ink:#EEF2FF; --ink2:#A9B4D8; --line:#34426B;
    --pink:#FF8FB4; --pink-soft:#4A2C48; --sun:#FFD36E; --sun-soft:#4A4130; --mint:#7FD6AE;
  }
}
:root[data-theme="dark"]{
  --bg:#161E36; --sea:#20305A; --land:#2E5249; --land-edge:#3A6559;
  --card:#212C4D; --ink:#EEF2FF; --ink2:#A9B4D8; --line:#34426B;
  --pink:#FF8FB4; --pink-soft:#4A2C48; --sun:#FFD36E; --sun-soft:#4A4130; --mint:#7FD6AE;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  font-weight:500; line-height:1.6; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:560px; margin:0 auto; padding:20px 16px 48px}
img,svg{max-width:100%}
a{color:var(--pink)}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--sun); outline-offset:2px; border-radius:8px}

/* header */
.head{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:14px}
.head h1{margin:0; font-size:2rem; line-height:1.1; font-weight:800; letter-spacing:.02em}
.head h1 span{display:block; font-size:.8rem; font-weight:700; color:var(--ink2); letter-spacing:.05em; margin-bottom:6px}
.route-emoji{font-size:1.5rem; white-space:nowrap}

/* status bubble */
.bubble{
  position:relative; background:var(--card); border-radius:28px 28px 28px 8px;
  padding:18px 18px 16px; box-shadow:0 3px 0 var(--line);
}
.bubble .face{font-size:2.4rem; line-height:1; float:right; margin:-4px -2px 4px 10px}
.bubble .title{font-size:1.35rem; font-weight:800; line-height:1.35; margin:0 0 4px}
.bubble .sub{margin:0; color:var(--ink2); font-weight:700}
.bubble .pill{
  display:inline-block; margin-top:12px; padding:6px 14px; border-radius:999px;
  background:var(--pink-soft); color:var(--ink); font-weight:800; font-size:.95rem
}
.preview-flag{display:none; margin:0 0 10px; font-size:.85rem; font-weight:800; color:var(--ink); background:var(--sun-soft); padding:4px 12px; border-radius:999px; width:max-content}
.previewing .preview-flag{display:block}

/* map */
.map{margin:14px 0 0; background:var(--sea); border-radius:28px; overflow:hidden; position:relative}
.map svg{display:block; width:100%; height:auto}
.land{fill:var(--land); stroke:var(--land); stroke-width:6; stroke-linejoin:round}
.route-base{fill:none; stroke:var(--ink2); stroke-opacity:.45; stroke-width:2.5; stroke-dasharray:2 7; stroke-linecap:round}
.route-done{fill:none; stroke:var(--pink); stroke-width:4; stroke-linecap:round}
.pin circle{fill:var(--card); stroke:var(--ink2); stroke-width:2.5}
.pin.reached circle{fill:var(--pink); stroke:var(--card)}
.pin text{font-family:inherit; font-size:12px; font-weight:800; fill:var(--ink); paint-order:stroke; stroke:var(--sea); stroke-width:4px; stroke-linejoin:round}
.plane-body{fill:var(--sun); stroke:var(--ink); stroke-width:1.6; stroke-linejoin:round}
.plane-window{fill:var(--ink)}
.plane-cheek{fill:var(--pink)}
#planeBob{animation:bob 2.4s ease-in-out infinite}
.waiting #planeBob{animation:hop 1.1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
@media (prefers-reduced-motion: reduce){#planeBob{animation:none!important}}

/* progress */
.progress{margin:18px 4px 6px; position:relative; height:34px}
.bar{position:absolute; left:0; right:0; top:14px; height:8px; border-radius:99px; background:var(--card)}
.bar i{display:block; height:100%; width:0; border-radius:99px; background:var(--pink)}
.tick{position:absolute; top:10px; width:16px; height:16px; margin-left:-8px; border-radius:50%; background:var(--card); border:3px solid var(--line)}
.tick.on{border-color:var(--pink)}
.mini-plane{position:absolute; top:-2px; margin-left:-13px; font-size:1.3rem; line-height:1; transition:left .4s}
.labels{display:flex; justify-content:space-between; font-size:.75rem; color:var(--ink2); font-weight:700; margin:0 0 18px}

/* clocks */
.clocks{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:28px}
.clock{background:var(--card); border-radius:20px; padding:10px 14px}
.clock small{display:block; color:var(--ink2); font-weight:700; font-size:.78rem}
.clock b{font-size:1.6rem; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:.02em}

/* timeline */
h2{font-size:1.1rem; font-weight:800; margin:0 0 12px}
.route{list-style:none; margin:0; padding:0; position:relative}
.route::before{content:""; position:absolute; left:21px; top:20px; bottom:20px; border-left:3px dotted var(--ink2); opacity:.45}
.stop{display:flex; gap:12px; align-items:flex-start; padding:6px 0; position:relative}
.stop .dot{flex:0 0 44px; height:44px; border-radius:50%; background:var(--card); display:grid; place-items:center; font-size:1.35rem; border:3px solid var(--line); z-index:1}
.stop.done .dot{border-color:var(--pink)}
.stop.now .dot{border-color:var(--sun); background:var(--sun-soft)}
.stop h3{margin:6px 0 0; font-size:1.05rem; font-weight:800}
.stop p{margin:0; color:var(--ink2); font-size:.88rem; font-weight:700}
.leg{padding:6px 0 6px 56px}
.card{background:var(--card); border-radius:22px; padding:14px 16px; border:3px solid transparent}
.leg.now .card{border-color:var(--sun)}
.leg.done .card{opacity:.72}
.row1{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.fno{font-weight:800; font-size:1.05rem}
.op{font-size:.8rem; color:var(--ink2); font-weight:700}
.nowtag{margin-left:auto; font-size:.75rem; font-weight:800; background:var(--sun); color:#2E3A59; border-radius:999px; padding:2px 10px}
.times{display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:8px; margin:8px 0 2px}
.times b{display:block; font-size:1.5rem; font-weight:800; line-height:1.1; font-variant-numeric:tabular-nums}
.times small{display:block; font-size:.75rem; color:var(--ink2); font-weight:700}
.times .r{text-align:right}
.times .mid{text-align:center; font-size:.75rem; color:var(--ink2); font-weight:700; border-bottom:2px dashed var(--line); padding-bottom:2px}
.jst{margin:4px 0 10px; font-size:.8rem; color:var(--ink2); font-weight:700}
.facts{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:0 0 12px}
.facts div{background:var(--bg); border-radius:12px; padding:6px 8px}
.facts dt{font-size:.68rem; color:var(--ink2); font-weight:700}
.facts dd{margin:0; font-weight:800; font-size:.9rem}
.delay{display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:.82rem; font-weight:700}
.delay .state{margin-right:auto}
.delay button{font:inherit; font-weight:800; color:var(--ink); background:var(--bg); border:0; border-radius:999px; padding:6px 12px; cursor:pointer}
.delay button:active{transform:scale(.96)}
.delay a{flex-basis:100%; font-size:.8rem}
.late{color:var(--pink)}

/* preview */
details.preview{margin-top:28px; background:var(--card); border-radius:20px; padding:12px 16px}
details.preview summary{cursor:pointer; font-weight:800}
details.preview input{width:100%; margin:12px 0 4px; accent-color:var(--pink)}
details.preview .pv{display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:.85rem; font-weight:700; color:var(--ink2)}
details.preview button{font:inherit; font-weight:800; background:var(--pink); color:#fff; border:0; border-radius:999px; padding:6px 14px; cursor:pointer}
.live{margin:10px 0 0; font-size:.8rem; font-weight:700; color:var(--ink2)}
.live b{color:var(--mint)}
.livetag{display:inline-block; font-size:.75rem; font-weight:800; padding:2px 10px; border-radius:999px; background:var(--bg); margin-right:auto}
.livetag.ok{color:var(--mint)}
.livetag.late{color:var(--pink)}
.note{font-size:.78rem; color:var(--ink2); margin:18px 4px 0}
@media (max-width:380px){ .head h1{font-size:1.7rem} }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="head">
    <h1><span>妹の帰国をみまもる</span>おかえりフライト</h1>
    <div class="route-emoji" aria-hidden="true">🦘 ✈️ 🗾</div>
  </header>

  <section class="bubble" aria-live="polite">
    <p class="preview-flag">⏳ 時間プレビュー中</p>
    <div class="face" id="face" aria-hidden="true">🦘</div>
    <p class="title" id="title">…</p>
    <p class="sub" id="sub"></p>
    <span class="pill" id="pill"></span>
    <p class="live" id="liveLine">📡 運航データはまだ届いていません（予定時刻で表示中）</p>
  </section>

  <div class="map" id="map">
    <svg viewBox="0 0 360 460" role="img" aria-label="ブルームから成田までのルートと現在地">
      <g>
        <polygon class="land" points="0,0 240,0 240.2,7.3 222.5,18.1 233.1,32.6 231.7,46.1 211.9,48.8 210.4,36.9 197.7,20.8 176.4,18.1 158.7,28.8 183.5,36.9 169.4,50.4 172.9,63.9 180,71.9 165.8,96.2 144.6,109.6 105.6,118.8 95,123.1 80.8,120.4 66.7,131.2 84.4,150 89.3,168.8 73.7,179.6 59.6,188.8 41.9,171.5 27.7,166.2 41.9,201.2 49,214.6 53.9,228.1 49,229.2 34.8,220 24.2,203.9 10,193.1 0,193"/>
        <polygon class="land" points="0,214.6 10,214.6 27.7,230.8 49,244.2 66.7,267.3 56,267.8 31.2,252.3 10,236.2 0,236.2"/>
        <polygon class="land" points="63.1,270.5 80.8,269.4 102.1,270.5 126.9,275.9 126.9,281.3 95,279.6 66.7,274.8"/>
        <polygon class="land" points="87.9,225.9 102.1,226.5 116.2,220 134,209.2 144.6,198.5 162.3,209.2 155.2,228.7 141,252.9 126.9,255.6 102.1,250.2 98.5,242.2"/>
        <polygon class="land" points="165.8,136.5 180,136.5 176.4,152.7 181.4,160.8 194.2,166.2 204.8,187.7 208.3,198.5 201.2,203.9 180,193.1 185,175 170,160 165.8,150"/>
        <polygon class="land" points="167.2,114.5 176.4,100.5 179.2,104.2 168.3,117.7"/>
        <polygon class="land" points="243,53.1 257.9,51.5 273.5,49.8 286.2,49.3 300.4,47.7 313.9,43.9 314.6,31.5 318.1,18.1 307.5,14.3 306.1,20.8 300.4,31.5 286.2,36.9 279.1,43.4 257.9,45 243.7,50.4"/>
        <polygon class="land" points="254.4,54.2 270,52.1 268.6,56.9 258,59.6"/>
        <polygon class="land" points="307.5,12.7 316,11.1 328.8,8.4 346.5,3 318.1,-8.8 306.1,4.6"/>
        <polygon class="land" points="235.2,56.9 243.7,54.2 249.4,58.5 245.8,67.2 238.1,68.2 234.6,61.2"/>
        <polygon class="land" points="243.7,236.2 293.3,244.2 314.6,250.2 350,265.9 360,270 360,285 350,279.6 318.1,284.8 293.3,281 272.1,260.5 250.8,257.9 243.7,247.1"/>
        <polygon class="land" points="123.3,354.6 119.8,376.2 130.4,419.3 151.7,424.7 194.2,416.6 243.7,405.8 272.1,422 293.3,424.7 307.5,440.8 316,460 360,460 360,338.5 350,338.5 325.2,293.8 318.1,327.6 279.2,300.6 243.7,300.6 229.6,316.7 208.3,311.4 180,327.6 151.7,343.8"/>
      </g>
      <g id="routes">
        <path class="route-base" id="b0" d="M181.6,332.8 Q205,380 136.5,408.2"/>
        <path class="route-base" id="b1" d="M136.5,408.2 Q70,330 52.4,228.9"/>
        <path class="route-base" id="b2" d="M52.4,228.9 Q150,70 310.2,43.5"/>
        <path class="route-done" id="r0" d="M181.6,332.8 Q205,380 136.5,408.2"/>
        <path class="route-done" id="r1" d="M136.5,408.2 Q70,330 52.4,228.9"/>

      </g>
      <g id="pins">
        <g class="pin" data-i="0"><circle cx="181.6" cy="332.8" r="6"/><text x="192" y="337">ブルーム</text></g>
        <g class="pin" data-i="1"><circle cx="136.5" cy="408.2" r="6"/><text x="146" y="398">パース</text></g>
        <g class="pin" data-i="2"><circle cx="52.4" cy="228.9" r="6"/><text x="16" y="208">シンガポール</text></g>

      <g id="plane" transform="translate(181.6,332.8)">
        <g id="planeRot">
          <g id="planeBob">
            <path class="plane-body" d="M-4,-3 L-1,-15 L4,-15 L3,-3 Z"/>
            <path class="plane-body" d="M-4,3 L-1,15 L4,15 L3,3 Z"/>
            <path class="plane-body" d="M-12,-2 L-15,-8 L-11,-8 L-7,-3 Z"/>
            <path class="plane-body" d="M-12,2 L-15,8 L-11,8 L-7,3 Z"/>
            <ellipse class="plane-body" cx="0" cy="0" rx="15" ry="5.5"/>
            <circle class="plane-window" cx="7.5" cy="-1" r="1.4"/>
            <circle class="plane-window" cx="3" cy="-1" r="1.1"/>
            <circle class="plane-window" cx="-1.5" cy="-1" r="1.1"/>
            <circle class="plane-cheek" cx="10" cy="2" r="1.4"/>
          </g>
        </g>
      </g>
    </svg>
  </div>

  <div class="progress" aria-hidden="true">
    <div class="bar"><i id="barFill"></i></div>
    <span class="tick" id="t0" style="left:0%"></span>
    <span class="tick" id="t1"></span>
    <span class="tick" id="t2"></span>
    <span class="tick" id="t3" style="left:100%"></span>
    <span class="mini-plane" id="miniPlane">✈️</span>
  </div>
  <div class="labels"><span>ブルーム</span><span>パース</span><span>シンガポール</span><span>成田</span></div>

  <div class="clocks">
    <div class="clock"><small>日本の時間</small><b id="clockJp">--:--</b></div>
    <div class="clock"><small id="clockLocalLabel">妹のいる場所の時間</small><b id="clockLocal">--:--</b></div>
  </div>

  <h2>乗り継ぎのながれ</h2>
  <ol class="route" id="timeline"></ol>

  <details class="preview">
    <summary>時間を動かしてプレビュー</summary>
    <input type="range" id="slider" step="300000" aria-label="プレビューする時刻">
    <div class="pv"><span id="pvLabel"></span><button type="button" id="resetNow">いまに戻す</button></div>
  </details>

  <p class="note">📡マークの便は、Claude Codeが定期的に読みに行った運航データ（実際の出発・着陸時刻や見込み）で位置を計算しています。データが無い便は予定時刻で計算し、「+15分」で手動調整もできます（この端末だけに保存）。</p>
</div>

<script>
(function(){
  var LEGS = [
    {no:'QF1655', op:'カンタス航空', from:'BME', to:'PER', dep:'2026-09-17T14:15:00+08:00', arr:'2026-09-17T16:55:00+08:00', term:'—', gate:'—', board:'13:55', q:'QF1655'},
    {no:'QF77', op:'カンタス航空', from:'PER', to:'SIN', dep:'2026-09-17T23:20:00+08:00', arr:'2026-09-18T04:55:00+08:00', term:'T4', gate:'20', board:'22:35', q:'QF77'},
    {no:'JL712', op:'JAL運航（QF4021）', from:'SIN', to:'NRT', dep:'2026-09-18T08:05:00+08:00', arr:'2026-09-18T16:10:00+09:00', term:'T1', gate:'未定', board:'07:45', q:'JL712'}
  ];
  var AP = {
    BME:{name:'ブルーム', emoji:'🦘', tz:'Australia/Perth', x:181.6, y:332.8, i:0},
    PER:{name:'パース', emoji:'🌅', tz:'Australia/Perth', x:136.5, y:408.2, i:1},
    SIN:{name:'シンガポール', emoji:'🦁', tz:'Asia/Singapore', x:52.4, y:228.9, i:2},
    NRT:{name:'成田', emoji:'🗾', tz:'Asia/Tokyo', x:310.2, y:43.5, i:3}
  };
  var KEY = 'okaeri-flight-delays';
  var delays = [0,0,0];
  try { var s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (Array.isArray(s) && s.length === 3) delays = s.map(function(n){ return Number(n) || 0; }); } catch(e) {}
  function saveDelays(){ try { localStorage.setItem(KEY, JSON.stringify(delays)); } catch(e) {} }

  var override = null;
  try { var qt = new URLSearchParams(location.search).get('t'); if (qt && !isNaN(new Date(qt).getTime())) override = new Date(qt).getTime(); } catch(e) {}
  var live = null;
  function iso(v){ var t = v ? new Date(v).getTime() : NaN; return isNaN(t) ? null : t; }
  var $ = function(id){ return document.getElementById(id); };

  function legs(){
    return LEGS.map(function(l, i){
      var sd = new Date(l.dep).getTime(), sa = new Date(l.arr).getTime();
      var lv = live && Array.isArray(live.legs) ? live.legs[i] : null;
      var ld = lv ? iso(lv.dep) : null, la = lv ? iso(lv.arr) : null;
      if (ld != null || la != null) {
        var d = ld != null ? ld : sd;
        var a = la != null ? la : sa + (d - sd);
        return Object.assign({}, l, { i:i, sd:sd, sa:sa, d:d, a:a, lv:lv, isLive:true });
      }
      return Object.assign({}, l, { i:i, sd:sd, sa:sa, d:sd + delays[i]*60000, a:sa + delays[i]*60000, lv:null, isLive:false });
    });
  }
  var fmtCache = {};
  function fmt(ms, tz, kind){
    var k = tz + kind;
    if (!fmtCache[k]) {
      fmtCache[k] = kind === 'hm'
        ? new Intl.DateTimeFormat('ja-JP', {timeZone:tz, hour:'2-digit', minute:'2-digit', hourCycle:'h23'})
        : new Intl.DateTimeFormat('ja-JP', {timeZone:tz, month:'numeric', day:'numeric', weekday:'short'});
    }
    return fmtCache[k].format(ms);
  }
  function hm(ms, tz){ return fmt(ms, tz, 'hm'); }
  function md(ms, tz){ return fmt(ms, tz, 'md'); }
  function dur(ms){
    var m = Math.max(0, Math.round(ms/60000)), h = Math.floor(m/60), mm = m % 60;
    return h ? h + '時間' + (mm ? mm + '分' : '') : mm + '分';
  }

  function stateAt(now, L){
    for (var i = 0; i < 3; i++) {
      if (now < L[i].d) return { kind: i ? 'lay' : 'pre', at: L[i].from, leg: i };
      if (now < L[i].a) return { kind: 'fly', leg: i, frac: (now - L[i].d) / (L[i].a - L[i].d) };
    }
    return { kind: 'arr', since: now - L[2].a };
  }

  var paths = [$('r0'), $('r1'), $('r2')];
  var lens = paths.map(function(p){ return p.getTotalLength(); });
  paths.forEach(function(p, i){ p.style.strokeDasharray = lens[i] + ' ' + lens[i]; });

  function angleOn(i, t){
    var len = lens[i], a = paths[i].getPointAtLength(Math.max(0, t*len - 1)), b = paths[i].getPointAtLength(Math.min(len, t*len + 1));
    return Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
  }

  function render(){
    var now = override != null ? override : Date.now();
    var L = legs();
    var st = stateAt(now, L);
    document.getElementById('app').classList.toggle('previewing', override != null);

    // bubble
    var face, title, sub, pill = '';
    var toNrt = L[2].a - now;
    if (st.kind === 'pre') {
      face = '🦘'; title = 'ブルーム空港で出発を待ってるよ';
      sub = L[0].no + ' の出発まで あと ' + dur(L[0].d - now);
    } else if (st.kind === 'lay') {
      var ap = AP[st.at], nx = L[st.leg];
      face = ap.emoji; title = ap.name + '空港で乗り継ぎ中';
      sub = '次の ' + nx.no + ' の出発まで あと ' + dur(nx.d - now);
    } else if (st.kind === 'fly') {
      var lg = L[st.leg];
      face = '✈️'; title = AP[lg.from].name + ' → ' + AP[lg.to].name + ' の空の上！';
      sub = AP[lg.to].name + '到着まで あと ' + dur(lg.a - now) + '（' + Math.round(st.frac*100) + '% 飛んだよ）';
    } else if (st.since < 90*60000) {
      face = '🎌'; title = '成田に着いたよ！';
      sub = '入国審査や荷物の受け取り中かも';
    } else {
      face = '🎉'; title = 'おかえりなさい！';
      sub = '無事に日本に帰ってきたよ';
    }
    if (st.kind !== 'arr') pill = '成田到着まで あと ' + dur(toNrt);
    $('face').textContent = face; $('title').textContent = title; $('sub').textContent = sub;
    if (live && live.updatedAt && iso(live.updatedAt) != null) {
      var u = iso(live.updatedAt);
      var stale = st.kind !== 'arr' && Date.now() - u > 45*60000;
      $('liveLine').innerHTML = '📡 <b>' + md(u,'Asia/Tokyo') + ' ' + hm(u,'Asia/Tokyo') + '</b> に運航データを反映（' + esc(live.source || 'Flightradar24') + '）' + (stale ? '<br>⚠️ 少し前のデータです。最新は各便のリンクで確認を' : '');
    }
    $('pill').textContent = pill; $('pill').style.display = pill ? '' : 'none';

    // map routes
    paths.forEach(function(p, i){
      var done;
      if (st.kind === 'arr') done = 1;
      else if (st.kind === 'fly') done = i < st.leg ? 1 : (i === st.leg ? st.frac : 0);
      else done = i < st.leg ? 1 : 0;
      p.style.strokeDashoffset = lens[i] * (1 - done);
    });
    var reached = st.kind === 'arr' ? 3 : st.kind === 'fly' ? st.leg : AP[st.at].i;
    Array.prototype.forEach.call(document.querySelectorAll('.pin'), function(g){
      g.classList.toggle('reached', Number(g.getAttribute('data-i')) <= reached);
    });

    // plane
    var x, y, ang;
    if (st.kind === 'fly') {
      var pt = paths[st.leg].getPointAtLength(st.frac * lens[st.leg]);
      x = pt.x; y = pt.y; ang = angleOn(st.leg, st.frac);
    } else if (st.kind === 'arr') {
      x = AP.NRT.x; y = AP.NRT.y - 14; ang = angleOn(2, 1);
    } else {
      var a2 = AP[st.at]; x = a2.x; y = a2.y - 14; ang = angleOn(st.leg, 0);
    }
    $('plane').setAttribute('transform', 'translate(' + x.toFixed(1) + ',' + y.toFixed(1) + ')');
    $('planeRot').setAttribute('transform', 'rotate(' + ang.toFixed(1) + ')');
    $('map').classList.toggle('waiting', st.kind !== 'fly');

    // progress bar
    var t0 = L[0].d, total = L[2].a - t0;
    var f = Math.min(1, Math.max(0, (now - t0) / total));
    $('barFill').style.width = (f*100) + '%';
    $('t1').style.left = ((L[0].a - t0)/total*100) + '%';
    $('t2').style.left = ((L[1].a - t0)/total*100) + '%';
    $('miniPlane').style.left = (f*100) + '%';
    ['t0','t1','t2','t3'].forEach(function(id, i){ $(id).classList.toggle('on', i <= reached); });

    // clocks
    $('clockJp').textContent = hm(now, 'Asia/Tokyo');
    var tz, lbl;
    if (st.kind === 'arr') { tz = 'Asia/Tokyo'; lbl = '妹のいる場所（成田）'; }
    else if (st.kind === 'fly') { tz = AP[L[st.leg].from].tz; lbl = '妹の時計（機内・出発地）'; }
    else { tz = AP[st.at].tz; lbl = '妹のいる場所（' + AP[st.at].name + '）'; }
    $('clockLocal').textContent = hm(now, tz);
    $('clockLocalLabel').textContent = lbl;

    renderTimeline(L, st, now);
    syncSlider(L, now);
  }

  function esc(t){ return String(t).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function stopItem(code, cls, lines){
    var ap = AP[code];
    return '<li class="stop ' + cls + '"><span class="dot" aria-hidden="true">' + ap.emoji + '</span><div><h3>' + ap.name + '</h3>' +
      lines.map(function(t){ return '<p>' + t + '</p>'; }).join('') + '</div></li>';
  }
  function legItem(l, cls){
    var f = AP[l.from], t = AP[l.to];
    var dl = delays[l.i];
    var stateTxt = dl ? '<span class="late">' + dl + '分おくれで表示中</span>' : '予定どおりで表示中';
    var controls = '<button type="button" data-leg="' + l.i + '" data-v="-15">−15分</button>' +
      '<button type="button" data-leg="' + l.i + '" data-v="15">+15分</button>';
    if (l.isLive) {
      var diff = Math.round(((l.lv.arr ? l.a - l.sa : l.d - l.sd)) / 60000);
      var cls = diff > 10 ? 'late' : 'ok';
      var diffTxt = diff > 0 ? diff + '分おくれ' : diff < 0 ? (-diff) + '分はやい' : '定刻';
      stateTxt = '<span class="livetag ' + cls + '">📡 ' + (l.lv.label ? esc(l.lv.label) + '　' : '') + diffTxt + '</span>';
      controls = '';
    }
    return '<li class="leg ' + cls + '"><div class="card">' +
      '<div class="row1"><span class="fno">' + l.no + '</span><span class="op">' + l.op + '</span>' + (cls === 'now' ? '<span class="nowtag">いまここ</span>' : '') + '</div>' +
      '<div class="times"><div><b>' + hm(l.d, f.tz) + '</b><small>' + f.name + ' ' + md(l.d, f.tz) + '</small></div>' +
      '<div class="mid">' + dur(l.a - l.d) + '</div>' +
      '<div class="r"><b>' + hm(l.a, t.tz) + '</b><small>' + t.name + ' ' + md(l.a, t.tz) + '</small></div></div>' +
      '<p class="jst">日本時間だと ' + md(l.d,'Asia/Tokyo') + ' ' + hm(l.d,'Asia/Tokyo') + ' 発 → ' + md(l.a,'Asia/Tokyo') + ' ' + hm(l.a,'Asia/Tokyo') + ' 着</p>' +
      '<dl class="facts"><div><dt>ターミナル</dt><dd>' + esc(l.lv && l.lv.terminal ? l.lv.terminal : l.term) + '</dd></div><div><dt>ゲート</dt><dd>' + esc(l.lv && l.lv.gate ? l.lv.gate : l.gate) + '</dd></div>' +
      '<div><dt>搭乗開始</dt><dd>' + l.board + '</dd></div></dl>' +
      '<div class="delay"><span class="state">' + stateTxt + '</span>' + controls +
      '<a href="https://www.google.com/search?q=' + encodeURIComponent(l.q + ' flight status') + '" target="_blank" rel="noopener">' + l.no + ' の運航状況を調べる</a></div>' +
      '</div></li>';
  }
  function renderTimeline(L, st, now){
    var legCls = function(i){
      if (st.kind === 'arr') return 'done';
      if (st.kind === 'fly') return i < st.leg ? 'done' : i === st.leg ? 'now' : '';
      return i < st.leg ? 'done' : '';
    };
    var stopCls = function(i){
      if (st.kind === 'arr') return i === 3 ? 'now' : 'done';
      if (st.kind === 'fly') return i <= st.leg ? 'done' : '';
      var at = AP[st.at].i; return i < at ? 'done' : i === at ? 'now' : '';
    };
    var h = '';
    h += stopItem('BME', stopCls(0), ['出発 ' + md(L[0].d, AP.BME.tz) + ' ' + hm(L[0].d, AP.BME.tz) + '（現地）']);
    h += legItem(L[0], legCls(0));
    h += stopItem('PER', stopCls(1), ['乗り継ぎ ' + dur(L[1].d - L[0].a), '国際線はターミナル4へ']);
    h += legItem(L[1], legCls(1));
    h += stopItem('SIN', stopCls(2), ['乗り継ぎ ' + dur(L[2].d - L[1].a), 'チャンギ空港 ターミナル1から出発']);
    h += legItem(L[2], legCls(2));
    h += stopItem('NRT', stopCls(3), ['到着 ' + md(L[2].a, 'Asia/Tokyo') + ' ' + hm(L[2].a, 'Asia/Tokyo') + '（日本時間）', 'JALは第2ターミナルに到着']);
    $('timeline').innerHTML = h;
  }

  $('timeline').addEventListener('click', function(e){
    var b = e.target.closest('button[data-leg]');
    if (!b) return;
    var i = Number(b.getAttribute('data-leg'));
    delays[i] = Math.max(-60, delays[i] + Number(b.getAttribute('data-v')));
    saveDelays(); render();
  });

  var slider = $('slider');
  function syncSlider(L, now){
    slider.min = L[0].d - 4*3600000;
    slider.max = L[2].a + 3*3600000;
    if (document.activeElement !== slider) slider.value = Math.min(slider.max, Math.max(slider.min, now));
    $('pvLabel').textContent = '日本時間 ' + md(now, 'Asia/Tokyo') + ' ' + hm(now, 'Asia/Tokyo');
  }
  slider.addEventListener('input', function(){ override = Number(slider.value); render(); });
  $('resetNow').addEventListener('click', function(){ override = null; render(); });

  render();
  function loadStatus(){
    fetch('status.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(j){ if (j && Array.isArray(j.legs)) { live = j; render(); } })
      .catch(function(){ /* 取得失敗時は前回データ or 予定時刻で表示を続ける */ });
  }
  loadStatus();
  setInterval(loadStatus, 60000);
  setInterval(function(){ if (override == null) render(); }, 20000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) { loadStatus(); if (override == null) render(); } });
})();
</script>
</body>
</html>
